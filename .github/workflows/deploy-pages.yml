# Fetch news, build the Vite app, and publish dist/ to GitHub Pages.
# One workflow does all three: a push made with GITHUB_TOKEN does not
# start other workflows, so this file must not depend on a follow-up commit.
#
# actions/configure-pages accepts enablement: true, but that input needs a
# personal access token or GitHub App token. The default GITHUB_TOKEN cannot
# create a Pages site, so enablement is omitted. Pages for this repo is
# already set to GitHub Actions.

name: 更新资讯并发布到 GitHub Pages

on:
  schedule:
    - cron: '0 */3 * * *'
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == '资讯' ||
      contains(github.event.issue.labels.*.name, '资讯')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure 资讯 label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "资讯" \
            --color FFE500 \
            --description "站长发布的资讯。关闭这条 Issue 后，网站会撤下对应内容。" \
            --force

      - name: Check news and shop scripts
        run: node --test scripts/fetch-news.test.mjs scripts/fetch-shop.test.mjs scripts/shop-live.test.mjs

      - name: Fetch news and official releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/fetch-news.mjs

      - name: Fetch official shop prices
        run: node scripts/fetch-shop.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
